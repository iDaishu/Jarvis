# config.yaml
agent:
  name: "JARVIS"
  version: "1.0.0"
  language: "ru"

ollama:
  url: "http://127.0.0.1:11434/api/chat"
  fast_model: "qwen2.5:3b"
  smart_model: "qwen2.5:7b"
  vision_model: "llava"

memory:
  profile_file: "memory/profile.json"
  chroma_dir: "memory/chroma"
  voice_profile: "memory/voice_profile.json"

training:
  examples_file: "training/approved_examples.jsonl"
  dataset_file: "training/dataset.jsonl"
  lora_output: "training/lora_adapter"

tools:
  allowed_apps:
    блокнот: "notepad.exe"
    калькулятор: "calc.exe"
    проводник: "explorer.exe"
    paint: "mspaint.exe"

voice:
  enabled: true
  
  # ASR настройки
  asr:
    primary: "whisper"  # whisper, vosk
    whisper_model: "small"  # tiny, base, small, medium, large
    sample_rate: 16000
    vad_mode: 1
  
  # TTS настройки
  tts:
    primary: "silero"  # silero, piper
    language: "ru"
    speaker: "xenia"  # xenia (женский), eugene (мужской)
    rate: 170
    volume: 1.0
  
  # Шумоподавление
  noise_reduction:
    enabled: true
    prop_decrease: 0.8
    
  # Эмоции
  emotions:
    enabled: true
    intensity: 0.5