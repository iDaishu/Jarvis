# config.yaml
agent:
  name: "JARVIS"
  version: "1.0.0"
  language: "ru"

ollama:
  url: "http://127.0.0.1:11434/api/generate"
  fast_model: "qwen2.5:7b"    # Быстрые ответы
  smart_model: "aiconjured/Qwen3.8-27B-NVFP4-MTP-COMPACT-LOW"  # Сложные задачи
  vision_model: "llava"               # Для изображений

memory:
  profile_file: "memory/profile.json"
  chroma_dir: "memory/chroma"
  voice_profile: "memory/voice_profile.json"

training:
  examples_file: "training/approved_examples.jsonl"
  dataset_file: "training/dataset.jsonl"
  lora_output: "training/lora_adapter"

tools:
  allowed_apps:
    блокнот: "notepad.exe"
    калькулятор: "calc.exe"
    проводник: "explorer.exe"
    paint: "mspaint.exe"

voice:
  enabled: true
  
  # ASR настройки
  asr:
    primary: "vosk"  # vosk (рекомендуется), whisper
    vosk_model: "vosk-model-ru-0.22"
    sample_rate: 16000
    partial_results: true
  
  # TTS настройки
  tts:
    primary: "silero"  # silero, pyttsx3
    language: "ru"
    speaker: "xenia"
    rate: 170
    volume: 1.0
  
  # Шумоподавление
  noise_reduction:
    enabled: true
    prop_decrease: 0.8
    
  # Эмоции
  emotions:
    enabled: true
    intensity: 0.5