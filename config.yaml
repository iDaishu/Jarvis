# config.yaml
agent:
  name: "Аэлита"
  version: "2.0.0"
  language: "ru"
  character: "aelita"
  character_file: "character/aelita_profile.py"
  
  # Настройки саморазвития
  self_development:
    enabled: true
    research_interval: 120  # Секунд между поиском
    auto_research: true
    music_generation: true
    learning_enabled: true

ollama:
  url: "http://127.0.0.1:11434/api/generate"
  fast_model: "qwen2.5:7b"    # Быстрые ответы
  smart_model: "aiconjured/Qwen3.8-27B-NVFP4-MTP-COMPACT-LOW"  # Сложные задачи
  vision_model: "llava"               # Для изображений

memory:
  profile_file: "profile.json"
  chroma_dir: "chroma"
  voice_profile: "memory/voice_profile.json"

training:
  examples_file: "training/approved_examples.jsonl"
  dataset_file: "training/dataset.jsonl"
  lora_output: "training/lora_adapter"

tools:
  allowed_apps:
    блокнот: "notepad.exe"
    калькулятор: "calc.exe"
    проводник: "explorer.exe"
    paint: "mspaint.exe"

voice:
  enabled: true
  
  # ASR настройки
  asr:
    primary: "vosk"
    vosk_model: "vosk-model-ru-0.22"
    sample_rate: 16000
    partial_results: true
    silence_timeout: 0.4  # ✅ Уменьшено с 0.6
    min_phrase_length: 2
  
  # TTS настройки (оптимизация)
  tts:
    primary: "silero"
    language: "ru"
    speaker: "xenia"
    sample_rate: 16000  # ✅ Добавлено: 16 кГц вместо 48 кГц
    rate: 220  # ✅ Увеличена скорость речи
    volume: 0.85
    cache_size: 50
    max_text_length: 200  # ✅ Ограничение длины для скорости
  
  # Аудио настройки
  audio:
    blocksize: 256  # ✅ Уменьшено с 512 для меньшей задержки
    latency: "low"
    sample_rate: 16000
    stream_delay_ms: 50  # ✅ Уменьшено с 100
    noise_gate_threshold: 0.003
    silence_timeout: 0.3  # ✅ Уменьшено
    min_amplitude: 0.002
    max_buffer_size: 30  # ✅ Уменьшено с 50
  
  # Шумоподавление
  noise_reduction:
    enabled: true
    prop_decrease: 0.8
    
  # Эмоции
  emotions:
    enabled: true
    intensity: 0.5